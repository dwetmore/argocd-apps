apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cmatrix
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwetmore/argocd-apps.git
    targetRevision: main
    path: workloads/cmatrix
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
