apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwetmore/gpu-observability-gitops.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
