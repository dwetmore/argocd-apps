apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwetmore/gpu-observability-gitops.git
    targetRevision: HEAD
    path: clusters/microk8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {}
