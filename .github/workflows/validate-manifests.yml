name: Validate Manifests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.4.3'

      - name: Setup kubeconform
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION="v0.6.7"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Render Argo CD overlay
        run: kustomize build argocd/overlays/repo-server-copyutil-idempotent > rendered-argocd.yaml

      - name: Render manifests
        run: kustomize build . > rendered.yaml

      - name: Validate manifests with kubeconform
        run: kubeconform -strict -summary -ignore-missing-schemas rendered.yaml
